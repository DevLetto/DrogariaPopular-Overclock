<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Admin - Promoções</title>

    <link rel="stylesheet" href="../css/admin_global.css">
    <link rel="stylesheet" href="../css/admin_promocoes.css">
</head>

<body class="admin-body">

    <div class="admin-container">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">

            <div class="sidebar-header">

                <div class="logo-icon">
                    <img src="../img/logo_drogaria_ponteAlta.png">
                </div>

                <div class="logo-text">
                    <h2>PONTE ALTA</h2>
                    <span>PAINEL ADMIN</span>
                </div>

            </div>


            <div class="sidebar-menu">

                <span class="menu-label">VENDAS</span>

                <ul>

                    <li>
                        <a href="admin_produtos.html">
                            <img
                                src="../img/pedidos_icon.png"
                                alt=""
                                class="sidebar-icon"
                            >
                            Produtos
                        </a>
                    </li>

                    <li>
                        <a href="admin_pedidos.html">
                            <img
                                src="../img/carrinho_icon.png"
                                alt=""
                                class="sidebar-icon"
                            >
                            Pedidos
                        </a>
                    </li>

                    <li class="active">
                        <a href="admin_promocoes.html">
                            <img
                                src="../img/coracao_icon.png"
                                alt=""
                                class="sidebar-icon"
                            >
                            Promoções
                        </a>
                    </li>

                    <li>
                        <a href="admin_categorias.html">
                            <img
                                src="../img/categorias_icon.png"
                                alt=""
                                class="sidebar-icon"
                            >
                            Categorias
                        </a>
                    </li>

                </ul>


                <span class="menu-label">PESSOAS & LOJAS</span>

                <ul>

                    <li>
                        <a href="admin_clientes.html">
                            <img
                                src="../img/usuario_icon.png"
                                alt=""
                                class="sidebar-icon"
                            >
                            Clientes
                        </a>
                    </li>

                    <li>
                        <a href="admin_lojas.html">
                            <img
                                src="../img/localizacao_icon.png"
                                alt=""
                                class="sidebar-icon"
                            >
                            Lojas
                        </a>
                    </li>

                    <li>
                        <a href="admin_servicos.html">
                            <img
                                src="../img/servicos_icon.png"
                                alt=""
                                class="sidebar-icon"
                            >
                            Serviços
                        </a>
                    </li>

                </ul>

            </div>


            <div class="sidebar-footer">

                <div class="user-avatar">
                    A
                </div>

                <div class="user-info">
                    <strong>Admin</strong>
                    <span>Gerência</span>
                </div>

            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="admin-content">

            <div class="content-header-container">

                <div class="content-header">

                    <h1>Promoções</h1>

                    <p>
                        Crie e gerencie descontos aplicados aos produtos.
                    </p>

                </div>

                <button
                    type="button"
                    class="btn-primary"
                    id="btnNovaPromocao"
                >
                    <img
                        src="../img/adicionar_icon.png"
                        alt="Adicionar"
                        class="btn-icon-img"
                    >
                    Nova promoção
                </button>

            </div>


            <!-- TABELA -->
            <div class="content-box">

                <div
                    class="table-container"
                    style="border: none;"
                >

                    <table class="admin-table">

                        <thead>

                            <tr>
                                <th>PRODUTO</th>
                                <th>PREÇO ORIGINAL</th>
                                <th>DESCONTO</th>
                                <th>PREÇO PROMO</th>
                                <th>VÁLIDO ATÉ</th>
                                <th>STATUS</th>
                                <th></th>
                            </tr>

                        </thead>

                        <tbody id="tabelaPromocoes">
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <script src="../javaScript/admin_promocoes.js"></script>

</body>

</html>
