<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Admin - Lojas</title>

    <link rel="stylesheet" href="../css/admin_global.css">
    <link rel="stylesheet" href="../css/admin_lojas.css">
</head>


<body class="admin-body">

    <div class="admin-container">


        <!-- SIDEBAR -->

        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <img src="../img/logo_drogaria_ponteAlta.png">
                </div>
                <div class="logo-text">
                    <h2>PONTE ALTA</h2>
                    <span>PAINEL ADMIN</span>
                </div>
            </div>

            <div class="sidebar-menu">
                <span class="menu-label">GERAL</span>
                <ul>
                    <li class=""><a href="admin_dashboard.html"><img src="../img/dashboard_icon.png" alt="" class="sidebar-icon"> Dashboard</a></li>
                </ul>

                <span class="menu-label">VENDAS</span>
                <ul>
                    <li><a href="admin_produtos.html"><img src="../img/pedidos_icon.png" alt="" class="sidebar-icon"> Produtos</a></li>
                    <li><a href="admin_pedidos.html"><img src="../img/carrinho_icon.png" alt="" class="sidebar-icon"> Pedidos</a></li>
                    <li><a href="admin_promocoes.html"><img src="../img/coracao_icon.png" alt="" class="sidebar-icon"> Promoções</a></li>
                    <li><a href="admin_categorias.html"><img src="../img/categorias_icon.png" alt="" class="sidebar-icon"> Categorias</a></li>
                </ul>

                <span class="menu-label">PESSOAS & LOJAS</span>
                <ul>
                    <li><a href="admin_clientes.html"><img src="../img/usuario_icon.png" alt="" class="sidebar-icon"> Clientes</a></li>
                    <li class="active"><a href="admin_lojas.html"><img src="../img/localizacao_icon.png" alt="" class="sidebar-icon"> Lojas</a></li>
                    <li><a href="admin_servicos.html"><img src="../img/servicos_icon.png" alt="" class="sidebar-icon"> Serviços</a></li>
                </ul>
            </div>

            <div class="sidebar-footer">
                <div class="user-avatar">A</div>
                <div class="user-info">
                    <strong>Admin</strong>
                    <span>Gerência</span>
                </div>
            </div>
        </aside>



        <!-- CONTEÚDO -->

        <main class="admin-content">


            <!-- CABEÇALHO -->

            <div class="content-header-container">

                <div class="content-header">

                    <h1>
                        Lojas
                    </h1>

                    <p>
                        Cadastre e gerencie as lojas da Drogaria Ponte Alta.
                    </p>

                </div>


                <button
                    type="button"
                    class="btn-primary"
                    id="btnNovaLoja"
                >

                    <img
                        src="../img/adicionar_icon.png"
                        alt="Adicionar"
                        class="btn-icon-img"
                    >

                    Nova loja

                </button>

            </div>



            <!-- TABELA -->

            <div
                class="content-box"
                style="margin-top: 24px;"
            >

                <div
                    class="table-container"
                    style="border: none;"
                >

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    LOJA
                                </th>

                                <th>
                                    TELEFONE
                                </th>

                                <th>
                                    HORÁRIO
                                </th>

                                <th>
                                    LOCALIZAÇÃO
                                </th>

                                <th>
                                    AÇÕES
                                </th>

                            </tr>

                        </thead>


                        <tbody id="tabelaLojas">

                            <!--
                                As lojas serão
                                carregadas pela API
                            -->

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>



    <!-- MODAL -->

    <div
        id="modalLoja"
        class="modal-overlay"
        style="display: none;"
    >

        <div class="modal">

            <div class="modal-header">

                <h2 id="tituloModal">
                    Nova loja
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    id="btnFecharModal"
                >
                    &times;
                </button>

            </div>


            <form id="formLoja">

                <div class="form-group">

                    <label for="nomeLoja">
                        Nome da loja
                    </label>

                    <input
                        type="text"
                        id="nomeLoja"
                        required
                        placeholder="Ex: Ponte Alta Norte"
                    >

                </div>


                <div class="form-group">

                    <label for="telefoneLoja">
                        Telefone
                    </label>

                    <input
                        type="text"
                        id="telefoneLoja"
                        placeholder="Ex: (61) 3333-4444"
                    >

                </div>


                <div class="form-group">

                    <label for="horarioLoja">
                        Horário de funcionamento
                    </label>

                    <input
                        type="text"
                        id="horarioLoja"
                        placeholder="Ex: Seg-Sáb 7h-22h"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="latitudeLoja">
                            Latitude
                        </label>

                        <input
                            type="number"
                            id="latitudeLoja"
                            step="any"
                            placeholder="-15.000000"
                        >

                    </div>


                    <div class="form-group">

                        <label for="longitudeLoja">
                            Longitude
                        </label>

                        <input
                            type="number"
                            id="longitudeLoja"
                            step="any"
                            placeholder="-47.000000"
                        >

                    </div>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn-secondary"
                        id="btnCancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Salvar loja
                    </button>

                </div>

            </form>

        </div>

    </div>



    <script src="../javaScript/admin_lojas.js"></script>
    <script src="../javaScript/admin_header.js"></script>

</body>

</html>
