<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Admin - Serviços</title>

    <link rel="stylesheet" href="../css/admin_global.css">
    <link rel="stylesheet" href="../css/admin_servicos.css">
</head>


<body class="admin-body">

    <div class="admin-container">


        <!-- SIDEBAR -->

        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <img src="../img/logo_drogaria_ponteAlta.png">
                </div>
                <div class="logo-text">
                    <h2>PONTE ALTA</h2>
                    <span>PAINEL ADMIN</span>
                </div>
            </div>

            <div class="sidebar-menu">
                <span class="menu-label">GERAL</span>
                <ul>
                    <li class=""><a href="admin_dashboard.html"><img src="../img/dashboard_icon.png" alt="" class="sidebar-icon"> Dashboard</a></li>
                </ul>

                <span class="menu-label">VENDAS</span>
                <ul>
                    <li><a href="admin_produtos.html"><img src="../img/pedidos_icon.png" alt="" class="sidebar-icon"> Produtos</a></li>
                    <li><a href="admin_pedidos.html"><img src="../img/carrinho_icon.png" alt="" class="sidebar-icon"> Pedidos</a></li>
                    <li><a href="admin_promocoes.html"><img src="../img/coracao_icon.png" alt="" class="sidebar-icon"> Promoções</a></li>
                    <li><a href="admin_categorias.html"><img src="../img/categorias_icon.png" alt="" class="sidebar-icon"> Categorias</a></li>
                </ul>

                <span class="menu-label">PESSOAS & LOJAS</span>
                <ul>
                    <li><a href="admin_clientes.html"><img src="../img/usuario_icon.png" alt="" class="sidebar-icon"> Clientes</a></li>
                    <li><a href="admin_lojas.html"><img src="../img/localizacao_icon.png" alt="" class="sidebar-icon"> Lojas</a></li>
                    <li class="active"><a href="admin_servicos.html"><img src="../img/servicos_icon.png" alt="" class="sidebar-icon"> Serviços</a></li>
                </ul>
            </div>

            <div class="sidebar-footer">
                <div class="user-avatar">A</div>
                <div class="user-info">
                    <strong>Admin</strong>
                    <span>Gerência</span>
                </div>
            </div>
        </aside>



        <!-- CONTEÚDO -->

        <main class="admin-content">


            <div class="content-header-container">

                <div class="content-header">

                    <h1>
                        Serviços
                    </h1>

                    <p>
                        Gerencie os serviços oferecidos e seus valores.
                    </p>

                </div>


                <button
                    type="button"
                    class="btn-primary"
                    id="btnNovoServico"
                >

                    <img
                        src="../img/adicionar_icon.png"
                        alt="Adicionar"
                        class="btn-icon-img"
                    >

                    Novo serviço

                </button>

            </div>



            <!-- TABELA -->

            <div
                class="content-box"
                style="margin-top: 24px;"
            >

                <div
                    class="table-container"
                    style="border: none;"
                >

                    <table class="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    SERVIÇO
                                </th>

                                <th>
                                    DESCRIÇÃO
                                </th>

                                <th>
                                    VALOR
                                </th>

                                <th>
                                    LOJA
                                </th>

                                <th>
                                    AÇÕES
                                </th>

                            </tr>

                        </thead>


                        <tbody id="tabelaServicos">

                            <!-- Serviços carregados pela API -->

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>



    <!-- ==========================================
         MODAL
         ========================================== -->

    <div
        id="modalServico"
        class="modal-overlay"
        style="display: none;"
    >

        <div class="modal">

            <div class="modal-header">

                <h2 id="tituloModal">
                    Novo serviço
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    id="btnFecharModal"
                >
                    &times;
                </button>

            </div>


            <form id="formServico">


                <div class="form-group">

                    <label for="nomeServico">
                        Nome do serviço
                    </label>

                    <input
                        type="text"
                        id="nomeServico"
                        required
                        placeholder="Ex: Aplicação de injeções"
                    >

                </div>


                <div class="form-group">

                    <label for="descricaoServico">
                        Descrição
                    </label>

                    <textarea
                        id="descricaoServico"
                        placeholder="Descrição do serviço..."
                        rows="4"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="valorServico">
                        Valor
                    </label>

                    <input
                        type="number"
                        id="valorServico"
                        min="0"
                        step="0.01"
                        required
                        placeholder="0,00"
                    >

                </div>


                <div class="form-group">

                    <label for="lojaServico">
                        Loja
                    </label>

                    <select
                        id="lojaServico"
                        required
                    >

                        <option value="">
                            Selecione uma loja
                        </option>

                    </select>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn-secondary"
                        id="btnCancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Salvar serviço
                    </button>

                </div>

            </form>

        </div>

    </div>



    <script src="../javaScript/admin_servicos.js"></script>
    <script src="../javaScript/admin_header.js"></script>

</body>

</html>
