spring.application.name=drogaria-backend
spring.profiles.active=dev

# Ajuste usuario/senha do seu MariaDB local
spring.datasource.url=jdbc:mariadb://localhost:3306/drogaria
spring.datasource.username=root
spring.datasource.password=senha123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ddl-auto=none porque as tabelas ja existem via SQL (nao deixa o Hibernate mexer no schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

server.port=8080

# Receitas enviadas pelos clientes
app.receitas.storage-dir=${APP_RECEITAS_STORAGE_DIR:./storage/receitas}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB



# Em desenvolvimento, informe a origem real do Live Server quando diferente da padrao.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
