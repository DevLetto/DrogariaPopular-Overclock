spring.application.name=drogaria-backend

# Ajuste usuario/senha do seu MariaDB local
spring.datasource.url=jdbc:mariadb://localhost:3306/drogaria
spring.datasource.username=root
spring.datasource.password=senha123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ddl-auto=none porque as tabelas ja existem via SQL (nao deixa o Hibernate mexer no schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

server.port=8080
