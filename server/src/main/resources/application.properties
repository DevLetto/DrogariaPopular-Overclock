spring.application.name=drogaria-backend

# Ajuste usuario/senha do seu MariaDB local
spring.datasource.url=jdbc:mariadb://localhost:3306/drogaria
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ddl-auto=none porque as tabelas ja existem via SQL (nao deixa o Hibernate mexer no schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

server.port=8080

# Lista separada por virgulas; atribui acesso administrativo sem expor perfil na API.
app.security.admin-emails=${APP_SECURITY_ADMIN_EMAILS:}
app.security.pharmacist-emails=${APP_SECURITY_PHARMACIST_EMAILS:}
app.security.attendant-emails=${APP_SECURITY_ATTENDANT_EMAILS:}
app.security.stock-emails=${APP_SECURITY_STOCK_EMAILS:}

# Em desenvolvimento, informe a origem real do Live Server quando diferente da padrao.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
